services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - "./src/CampusCore.Migrator/Migrations/000000/0000000000001 CREATE TABLE students.sql:/docker-entrypoint-initdb.d/001-students.sql:ro"
      - "./src/CampusCore.Migrator/Migrations/000000/0000000000002 CREATE TABLE student_groups.sql:/docker-entrypoint-initdb.d/002-student-groups.sql:ro"
      - "./src/CampusCore.Migrator/Migrations/000000/0000000000003 CREATE TABLE student_name_statistic.sql:/docker-entrypoint-initdb.d/003-student-name-statistic.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backoffice:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      UseHttpsRedirection: ${USE_HTTPS_REDIRECTION}
      ConnectionStrings__Default: ${ConnectionStrings__Default}
    ports:
      - "${BACKOFFICE_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
